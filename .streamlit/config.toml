[theme]
base = "dark"
primaryColor = "#0084ff"
backgroundColor = "#0a1628"
secondaryBackgroundColor = "#2d3e50"
textColor = "#ecf0f1"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"

[logger]
level = "info"

[server]
port = 8501
headless = true
runOnSave = true
maxUploadSize = 200
enableXsrfProtection = true
enableCORS = false
